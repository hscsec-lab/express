[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "express"
version = "0.4.0"
description = "Visual Analysis & Distribution Toolkit for Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "HIVE Lab" },
]
keywords = ["transformers", "s3", "model-distribution", "torrent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.13.0",
    "boto3>=1.42.9",
    "dill>=0.4.0",
    "joblib>=1.5.3",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "simple-file-checksum>=1.3.1",
    "textual>=8.2.4",
    "torch>=2.11.0",
    "tqdm>=4.67.1",
    "transformers>=5.5.0",
    "typer>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[project.urls]
Repository = "https://gitlab.cyberspike.top/aszl/diamond-shovel/al-1s/hive/express"
"Merge requests" = "https://gitlab.cyberspike.top/aszl/diamond-shovel/al-1s/hive/express/-/merge_requests"

[project.scripts]
express = "express.vendor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["express*"]
exclude = ["express.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
