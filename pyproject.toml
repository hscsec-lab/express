[project]
name = "express"
version = "0.3.0"
description = "Visual Analysis & Distribution Toolkit for Transformers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "boto3==1.42.9",
    "dill>=0.4.0",
    "joblib>=1.5.3",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "rich>=14.2.0",
    "simple-file-checksum>=1.3.1",
    "textual>=8.2.4",
    "torch>=2.11.0",
    "tqdm>=4.67.1",
    "transformers>=5.5.0",
    "typer>=0.20.0",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]


[project.scripts]
express="express.vendor.cli:app"
