variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHON_IMAGE: docker.cat/docker/python:3.12
  CI_RUNNER_TAGS: "共享"
  REGISTRY_PROJECT_PATH: "gitlab/$CI_PROJECT_NAME"
  FINAL_IMAGE_NAME: ${CI_PROJECT_NAME}
  REGISTRY: $Docker_CI_REGISTRY
  REGISTRY_USER: $Docker_CI_REGISTRY_USER
  REGISTRY_PASSWORD: $Docker_CI_REGISTRY_PASSWORD
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  CACHE_REPO: "$Docker_CI_REGISTRY/$REGISTRY_PROJECT_PATH/cache"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: never

.test_pip_auth: &test_pip_auth
  - |
    set -eu
    USER="${Pypi_CI_REGISTRY_USER:-${DEVPI_USER:-gitlab}}"
    PASS="${Pypi_CI_REGISTRY_PASSWORD:-${DEVPI_PASSWORD:-}}"
    if [ -z "$PASS" ]; then
      echo "ERROR: set CI variable Pypi_CI_REGISTRY_PASSWORD (or DEVPI_PASSWORD)" >&2
      exit 1
    fi
    pip config set global.index-url "http://${USER}:${PASS}@pypi.dog.cat/gitlab/dev/+simple/"
    pip config set global.trusted-host pypi.dog.cat

.retry: &retry
  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
      - stuck_or_timeout_failure

include:
  - project: 'kxb/ci_template'
    ref: 'main'
    file: 'docker/docker.yml'
  - component: $CI_SERVER_FQDN/operations/components/docker/python-build@v1.8.1
    inputs:
      as: .python-build
      devpi_url: http://pypi.dog.cat
      devpi_user: $Pypi_CI_REGISTRY_USER
      devpi_password: $Pypi_CI_REGISTRY_PASSWORD
      devpi_index: gitlab/dev

stages:
  - test
  - build
  - publish

# Lightweight unit tests (avoid installing torch/transformers).
test:unit:
  stage: test
  image: "$PYTHON_IMAGE"
  tags: ["$CI_RUNNER_TAGS"]
  timeout: 15 minutes
  <<: *retry
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - *test_pip_auth
    - python -m pip install -U pip
    - pip install "pytest>=9.0.2" pydantic rich typer boto3
  script:
    - pytest
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "trigger"

# Branch builds: rewrite pyproject version to a PEP 440 .dev pre-release so
# informal publishes stay below the next formal tag (e.g. 0.4.1.dev12+gb7a6c3c).
prepare-dev-version:
  stage: publish
  image: "$PYTHON_IMAGE"
  tags: ["$CI_RUNNER_TAGS"]
  timeout: 5 minutes
  <<: *retry
  script:
    - |
      set -eu
      BASE="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
      if [ -z "${BASE}" ]; then
        echo "ERROR: could not read version from pyproject.toml"
        exit 1
      fi
      case "${BASE}" in
        *.dev*) DEV_BASE="${BASE}" ;;
        *) DEV_BASE="${BASE}.dev${CI_PIPELINE_IID}" ;;
      esac
      DEV_VERSION="${DEV_BASE}+g${CI_COMMIT_SHORT_SHA}"
      sed -i "s/^version = \"${BASE}\"/version = \"${DEV_VERSION}\"/" pyproject.toml
      echo "Dev publish version: ${BASE} -> ${DEV_VERSION}"
      grep -n '^version = ' pyproject.toml
  artifacts:
    paths:
      - pyproject.toml
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH

# Publish to internal devpi on branch pushes (dev versions) and on vX.Y.Z tags (formal).
python-build:
  extends: .python-build
  stage: publish
  <<: *retry
  needs:
    - job: prepare-dev-version
      optional: true
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH
